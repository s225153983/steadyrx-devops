# SonarCloud code quality analysis for the SteadyRx API.
# The token is never stored here. Jenkins injects SONAR_TOKEN from its
# credential store at run time.

sonar.projectKey=s225153983_steadyrx-devops
sonar.organization=s225153983
sonar.host.url=https://sonarcloud.io
sonar.projectName=SteadyRx DevOps

sonar.sources=app
sonar.tests=tests
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Reports produced by the Test and Code Quality stages.
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml
sonar.python.pylint.reportPaths=reports/pylint.txt
sonar.python.flake8.reportPaths=reports/flake8.txt
sonar.python.bandit.reportPaths=reports/bandit.json

# Exclusions. Demo seed data and the schema models are declarative code, so
# they are left out of duplication checks. Monitoring config is not app code.
sonar.cpd.exclusions=app/schemas.py,app/database.py
sonar.coverage.exclusions=app/metrics.py
sonar.exclusions=monitoring/**,deploy/**,ci/**,**/__pycache__/**
